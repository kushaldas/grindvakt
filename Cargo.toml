[package]
name = "grindvakt"
version = "0.6.2"
edition = "2021"
license = "BSD-2-Clause"
rust-version = "1.88"
description = "Reusable, runtime-agnostic OAuth2 / OpenID Connect / OpenID Federation protocol library built on jose-rs."
repository = "https://github.com/kushaldas/grindvakt"
keywords = ["oauth2", "openid-connect", "oidc", "jose", "dpop"]
categories = ["authentication", "web-programming"]

[features]
default = []
# Hardware-token signing via PKCS#11. Pulls in kryptering's pkcs11 backend and
# the cryptoki bindings; keys are selected by CKA_LABEL on the first slot with
# the single initialized token accepted by kryptering's default provider
# selection.
pkcs11 = ["kryptering/pkcs11", "dep:cryptoki"]
# Uses the redis crate's tokio-backed async transport with a shared,
# reconnecting multiplexed connection.
redis = ["dep:redis", "redis/tokio-comp", "redis/connection-manager"]

[dependencies]
jose-rs = { version = "0.6.0", default-features = false }
kryptering = { version = "0.5", default-features = false }
cryptoki = { version = "0.12", optional = true }
redis = { version = "1.3", optional = true, default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

base64 = "0.23"
url = "2"
form_urlencoded = "1"
percent-encoding = "2"
sha2 = "0.10"
hkdf = "0.12"

# PEM/DER/JWK signing-key loading (PEM -> kryptering SoftwareKey -> jose Jwk).
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
pem = "4"

time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
# redis-test's aio mock enables redis/aio, which requires a runtime comp
# feature; pin tokio-comp here so plain `cargo test` builds resolve.
redis = { version = "1.3", default-features = false, features = ["tokio-comp"] }
redis-test = { version = "1.0.4", features = ["aio"] }
tokio = { version = "1", features = ["full"] }
